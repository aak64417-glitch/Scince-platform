<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>المحقق العلمي</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07182d}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#07182d}
</style>
</head>
<body>
<iframe id="app" title="المحقق العلمي"></iframe>

<script>
(function(){
  const DEFAULT_API='https://script.google.com/macros/s/AKfycbz6-iPHp20-ZWMhgZA6WsAnZM-WPoCgPgFMyjbAHwg6xvGPGZhMDluhqOZGd20I6InDuw/exec';
  const q=new URLSearchParams(location.search);
  const API_URL=(q.get('api')||DEFAULT_API).trim();
  const frame=document.getElementById('app');

  // نفس منصة الطالب الأصلية، مع تجاوز الكاش لضمان تحميل النسخة الحالية.
  frame.src='index.html?api='+encodeURIComponent(API_URL)+'&guarded=2&v='+Date.now();

  function checkParticipation(name,className){
    return new Promise((resolve,reject)=>{
      const cb='__scienceCheck_'+Date.now()+'_'+Math.random().toString(36).slice(2);
      const s=document.createElement('script');
      let finished=false;

      function cleanup(){
        if(finished)return;
        finished=true;
        clearTimeout(timer);
        try{delete window[cb]}catch(e){window[cb]=undefined}
        if(s.parentNode)s.parentNode.removeChild(s);
      }

      const timer=setTimeout(()=>{
        cleanup();
        reject(new Error('timeout'));
      },15000);

      window[cb]=(data)=>{
        cleanup();
        resolve(data);
      };

      s.onerror=()=>{
        cleanup();
        reject(new Error('network'));
      };

      s.src=API_URL+
        (API_URL.includes('?')?'&':'?')+
        'action=check'+
        '&studentName='+encodeURIComponent(name)+
        '&className='+encodeURIComponent(className)+
        '&callback='+encodeURIComponent(cb)+
        '&_='+Date.now();

      document.head.appendChild(s);
    });
  }

  const DUP_MSG='سبق لك المشاركة في هذا النشاط. لا يمكنك المشاركة مرة أخرى إلا بعد أن يتيح لك المعلم إعادة المحاولة.';
  const CHECK_ERR='تعذر التحقق من المشاركة الآن. تأكد من الاتصال بالإنترنت ثم حاول مرة أخرى.';

  function setText(d,id,text){
    const el=d.getElementById(id);
    if(el)el.textContent=text;
  }

  frame.addEventListener('load',()=>{
    let d;
    try{
      d=frame.contentDocument;
      if(!d)return;
    }catch(e){
      return;
    }

    const startBtn=d.getElementById('startBtn');
    const submitBtn=d.getElementById('submitBtn');
    if(!startBtn || !submitBtn)return;

    // نحفظ المعالجات الأصلية كما هي، بدل الاعتماد على أسماء الدوال العالمية.
    const originalStart=startBtn.onclick;
    const originalSubmit=submitBtn.onclick;
    if(typeof originalStart!=='function' || typeof originalSubmit!=='function')return;

    let startBusy=false;
    let submitBusy=false;

    async function guardedStart(ev){
      // الالتقاط قبل onclick الأصلي، لذلك لا يمكن تجاوز الفحص.
      ev.preventDefault();
      ev.stopImmediatePropagation();
      if(startBusy)return;

      const cl=(d.getElementById('className')?.value||'').trim();
      const name=(d.getElementById('studentName')?.value||'').trim();

      // إذا لم يختر البيانات، اترك المنصة الأصلية تعرض التنبيه المعتاد.
      if(!cl || !name){
        originalStart.call(startBtn);
        return;
      }

      startBusy=true;
      startBtn.disabled=true;
      setText(d,'startError','جاري التحقق من المشاركة...');

      try{
        const data=await checkParticipation(name,cl);
        if(!data || data.ok!==true){
          throw new Error((data&&data.error)||'check failed');
        }

        if(data.submitted===true){
          setText(d,'startError',DUP_MSG);
          return;
        }

        setText(d,'startError','');
        originalStart.call(startBtn);
      }catch(e){
        setText(d,'startError',CHECK_ERR);
      }finally{
        startBusy=false;
        startBtn.disabled=false;
      }
    }

    async function guardedSubmit(ev){
      ev.preventDefault();
      ev.stopImmediatePropagation();
      if(submitBusy)return;

      const cl=(d.getElementById('className')?.value||'').trim();
      const name=(d.getElementById('studentName')?.value||'').trim();

      if(!cl || !name){
        setText(d,'submitError',CHECK_ERR);
        return;
      }

      submitBusy=true;
      submitBtn.disabled=true;
      setText(d,'submitError','جاري التحقق قبل إرسال النتيجة...');

      try{
        const data=await checkParticipation(name,cl);
        if(!data || data.ok!==true){
          throw new Error((data&&data.error)||'check failed');
        }

        if(data.submitted===true){
          setText(d,'submitError',DUP_MSG);
          return;
        }

        setText(d,'submitError','');
        originalSubmit.call(submitBtn);
      }catch(e){
        setText(d,'submitError',CHECK_ERR);
      }finally{
        submitBusy=false;
        submitBtn.disabled=false;
      }
    }

    // capture=true يضمن تنفيذ الفحص قبل onclick الموجود في index.html.
    startBtn.addEventListener('click',guardedStart,true);
    submitBtn.addEventListener('click',guardedSubmit,true);
  });
})();
</script>
</body>
</html>
