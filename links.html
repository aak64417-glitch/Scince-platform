<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تكوين روابط النشاط</title><style>body{font-family:Tahoma,Arial;background:#071326;color:#fff;margin:0}.w{max-width:850px;margin:30px auto;padding:20px}.c{background:#102746;border:1px solid #315c88;border-radius:16px;padding:18px}.f{margin:12px 0}.f label{display:block;font-weight:900;margin-bottom:6px}.f input{width:100%;padding:12px;border-radius:10px;border:1px solid #4776a7;background:#0b1f3a;color:#fff}.o{padding:12px;background:#081a31;border-radius:10px;word-break:break-all;margin:8px 0}.b{padding:11px 15px;border:0;border-radius:10px;background:#e5ae3d;font-weight:900;cursor:pointer}</style></head><body><div class="w"><div class="c"><h1>تكوين رابط الطلاب ورابط المعلم</h1><div class="f"><label>رابط موقع GitHub Pages (المجلد الذي فيه index.html)</label><input id="base" placeholder="https://username.github.io/repository/"></div><div class="f"><label>رابط Google Apps Script Web App</label><input id="api" placeholder="https://script.google.com/macros/s/.../exec"></div><button class="b" onclick="go()">تكوين الروابط</button><h3>رابط الطلاب</h3><div class="o" id="student">—</div><h3>رابط تقرير المعلم</h3><div class="o" id="teacher">—</div><p>احتفظ برمز تقرير المعلم الموجود في ملف README_AR.txt، وسيطلبه تقرير المعلم عند تحميل النتائج.</p></div></div><script>function go(){let b=document.getElementById('base').value.trim();const a=document.getElementById('api').value.trim();if(!b||!a)return;if(!b.endsWith('/'))b+='/';document.getElementById('student').textContent=b+'?api='+encodeURIComponent(a);document.getElementById('teacher').textContent=b+'teacher.html?api='+encodeURIComponent(a)}</script></body></html>
